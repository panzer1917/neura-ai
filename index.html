<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEURA</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1b1d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
(function () {
    var t = null;
    try { t = localStorage.getItem("neura_theme"); } catch (e) {}
    if (!t) {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>
:root {
    --bg: #1b1b1d;
    --panel: #161617;
    --surface: #242427;
    --user: #2a2a2e;
    --line: #303035;
    --text: #ececf0;
    --muted: #8e8e98;
    --accent: #ececf0;
    --accent-ink: #151516;
    --code: #151516;
    --hover: #27272b;
    --scrim: rgba(0, 0, 0, .55);
}

html[data-theme="light"] {
    --bg: #fafafa;
    --panel: #f2f2f4;
    --surface: #ffffff;
    --user: #ececef;
    --line: #e2e2e7;
    --text: #18181b;
    --muted: #6f6f7a;
    --accent: #18181b;
    --accent-ink: #ffffff;
    --code: #f1f1f4;
    --hover: #e9e9ed;
    --scrim: rgba(20, 20, 30, .3);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow: hidden;
}

button {
    font: inherit;
    color: inherit;
}

:focus-visible {
    outline: 2px solid var(--muted);
    outline-offset: 2px;
}

svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}

/* ---------- Layout ---------- */
.app {
    display: flex;
    height: 100dvh;
}

.sidebar {
    width: 268px;
    flex: none;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));
}

.brand {
    padding: 4px 12px 18px;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: .06em;
}

.new-chat {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 15px;
}

.new-chat:hover {
    background: var(--hover);
}

.history-title {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 12px 6px;
}

.history {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.history-empty {
    color: var(--muted);
    font-size: 14px;
    padding: 6px 12px;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: 10px;
    padding-left: 12px;
    cursor: pointer;
    color: var(--muted);
}

.chat-item:hover,
.chat-item.active {
    background: var(--hover);
    color: var(--text);
}

.chat-name {
    flex: 1;
    min-width: 0;
    padding: 10px 0;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.icon-btn {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
}

.icon-btn:hover {
    background: var(--hover);
    color: var(--text);
}

.chat-item .icon-btn {
    width: 34px;
    height: 34px;
}

.chat-item .icon-btn svg {
    width: 15px;
    height: 15px;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
}

.topbar .title {
    flex: 1;
    font-weight: 600;
    letter-spacing: .06em;
}

.menu-btn {
    display: none;
}

.scroller {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
}

.thread {
    max-width: 720px;
    min-height: 100%;
    margin: 0 auto;
    padding: 12px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 26px;
}

/* ---------- Welcome ---------- */
.welcome {
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    padding: 24px 0 40px;
}

.welcome h1 {
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.2;
}

.welcome p {
    color: var(--muted);
}

.chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
    max-width: 520px;
}

.chip {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
}

.chip:hover {
    color: var(--text);
    border-color: var(--muted);
}

/* ---------- Messages ---------- */
.msg.user {
    align-self: flex-end;
    max-width: 86%;
}

.bubble {
    background: var(--user);
    padding: 10px 16px;
    border-radius: 18px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.msg.ai .body {
    min-width: 0;
}

.msg.error .prose {
    color: var(--muted);
}

.actions {
    margin-top: 4px;
    margin-left: -8px;
    display: flex;
}

.text-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 0;
    border-radius: 8px;
    padding: 6px 8px;
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
}

.text-btn:hover {
    background: var(--hover);
    color: var(--text);
}

.text-btn svg {
    width: 15px;
    height: 15px;
}

.thinking {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    min-height: 28px;
}

.dots {
    display: inline-flex;
    gap: 5px;
}

.dots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
}

.dots i:nth-child(2) { animation-delay: .18s; }
.dots i:nth-child(3) { animation-delay: .36s; }

@keyframes blink {
    0%, 80%, 100% { opacity: .25; }
    40% { opacity: 1; }
}

/* ---------- Markdown ---------- */
.prose {
    line-height: 1.72;
    overflow-wrap: anywhere;
}

.prose > *:first-child { margin-top: 0; }
.prose > *:last-child { margin-bottom: 0; }

.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { padding-left: 24px; margin: 0 0 12px; }
.prose li { margin-bottom: 6px; }
.prose h1, .prose h2, .prose h3 {
    line-height: 1.3;
    margin: 20px 0 8px;
    font-weight: 600;
}
.prose h1 { font-size: 21px; }
.prose h2 { font-size: 19px; }
.prose h3 { font-size: 17px; }
.prose a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.prose strong { font-weight: 650; }
.prose blockquote {
    border-left: 2px solid var(--line);
    padding-left: 14px;
    color: var(--muted);
    margin: 0 0 12px;
}
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.prose table {
    display: block;
    overflow-x: auto;
    border-collapse: collapse;
    margin: 0 0 12px;
}
.prose th, .prose td {
    border: 1px solid var(--line);
    padding: 8px 12px;
    text-align: left;
}
.prose th { background: var(--surface); }

.prose code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .88em;
    background: var(--code);
    border-radius: 6px;
    padding: 2px 6px;
}

.codebox {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--code);
    margin: 4px 0 14px;
}

.codehead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 6px 3px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
}

.codebox pre {
    margin: 0;
    padding: 14px;
    overflow-x: auto;
}

.codebox pre code {
    background: none;
    padding: 0;
    font-size: 13.5px;
    line-height: 1.6;
}

/* ---------- Composer ---------- */
.composer-wrap {
    padding: 6px 14px calc(10px + env(safe-area-inset-bottom));
}

.composer {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
    transition: border-color .15s;
}

.composer:focus-within {
    border-color: var(--muted);
}

.composer textarea {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    line-height: 1.45;
    resize: none;
    max-height: 160px;
    padding: 9px 0;
}

.composer textarea::placeholder {
    color: var(--muted);
}

.send {
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: opacity .15s;
}

.send:disabled {
    opacity: .25;
    cursor: default;
}

.note {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 8px;
}

.scrim {
    display: none;
}

/* ---------- Mobile ---------- */
@media (max-width: 860px) {
    .menu-btn {
        display: grid;
    }

    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(82vw, 310px);
        z-index: 30;
        transform: translateX(-102%);
        transition: transform .22s ease;
    }

    .sidebar.open {
        transform: none;
    }

    .scrim.show {
        display: block;
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 20;
    }

    .thread {
        padding: 10px 16px 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .dots i {
        animation: none;
        opacity: .6;
    }

    .sidebar {
        transition: none;
    }
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar" aria-label="Söhbətlər">
    <div class="brand">NEURA</div>

    <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Yeni söhbət
    </button>

    <div class="history-title">Söhbətlər</div>
    <div class="history" id="history"></div>
</aside>

<div class="scrim" id="scrim"></div>

<section class="main">
    <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menyunu aç">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="title">NEURA</div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Görünüşü dəyiş">
            <svg viewBox="0 0 24 24" id="themeIcon"></svg>
        </button>
    </header>

    <div class="scroller" id="scroller">
        <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
        <form class="composer" id="form" autocomplete="off">
            <textarea id="input" rows="1" placeholder="NEURA-ya yaz" aria-label="Mesaj"></textarea>
            <button class="send" id="sendBtn" type="submit" aria-label="Göndər" disabled>
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
        </form>
        <div class="note">NEURA səhv edə bilər. Vacib məlumatları yoxla.</div>
    </div>
</section>

</div>

<script>
const API_URL = "https://neura-ai-mdy3.onrender.com/api/chat";
const STORAGE = "neura_conversations";

const ICON_COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>';
const ICON_MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>';

const SUGGESTIONS = [
    "Mənə sadə dildə izah et",
    "Mətnimi redaktə et",
    "Kod yazmağa kömək et",
    "Fikirlərimi sıraya sal"
];

let conversations = [];
try {
    conversations = JSON.parse(localStorage.getItem(STORAGE) || "[]");
} catch (e) {
    conversations = [];
}
conversations = conversations.filter(c => c.messages && c.messages.length > 0);

let currentId = null;
let pending = false;
let slow = false;

const $ = id => document.getElementById(id);
const thread = $("thread");
const scroller = $("scroller");
const historyBox = $("history");
const input = $("input");
const sendBtn = $("sendBtn");
const sidebar = $("sidebar");
const scrim = $("scrim");

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const isTouch = window.matchMedia("(pointer: coarse)").matches;

if (window.marked) {
    marked.setOptions({ breaks: true, gfm: true });
}

if (window.DOMPurify) {
    DOMPurify.addHook("afterSanitizeAttributes", node => {
        if (node.tagName === "A") {
            node.setAttribute("target", "_blank");
            node.setAttribute("rel", "noopener noreferrer");
        }
    });
}

function save() {
    try {
        localStorage.setItem(STORAGE, JSON.stringify(conversations));
    } catch (e) {}
}

function getCurrent() {
    return conversations.find(c => c.id === currentId);
}

function setProse(el, text) {
    if (window.marked && window.DOMPurify) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else {
        el.textContent = text;
    }
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const t = document.createElement("textarea");
        t.value = text;
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy"); } catch (err) {}
        t.remove();
    }
}

function flash(btn, label) {
    const old = btn.innerHTML;
    btn.innerHTML = ICON_COPY + label;
    setTimeout(() => { btn.innerHTML = old; }, 1500);
}

function enhanceCode(prose) {
    prose.querySelectorAll("pre").forEach(pre => {
        if (pre.parentElement.classList.contains("codebox")) return;

        const code = pre.querySelector("code");
        let lang = "kod";
        if (code) {
            const m = (code.className || "").match(/language-([\w+-]+)/);
            if (m) lang = m[1];
        }

        const box = document.createElement("div");
        box.className = "codebox";

        const head = document.createElement("div");
        head.className = "codehead";

        const label = document.createElement("span");
        label.textContent = lang;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "text-btn";
        btn.innerHTML = ICON_COPY + "Kopyala";
        btn.onclick = async () => {
            await copyText(code ? code.innerText : pre.innerText);
            flash(btn, "Kopyalandı");
        };

        head.append(label, btn);
        pre.parentNode.insertBefore(box, pre);
        box.append(head, pre);
    });
}

function scrollBottom() {
    scroller.scrollTop = scroller.scrollHeight;
}

/* ---------- History ---------- */
function renderHistory() {
    historyBox.innerHTML = "";

    if (conversations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "Hələ söhbət yoxdur.";
        historyBox.appendChild(empty);
        return;
    }

    conversations.forEach(c => {
        const row = document.createElement("div");
        row.className = "chat-item" + (c.id === currentId ? " active" : "");

        const name = document.createElement("span");
        name.className = "chat-name";
        name.textContent = c.title;

        row.onclick = () => {
            currentId = c.id;
            closeMenu();
            render();
        };

        const del = document.createElement("button");
        del.type = "button";
        del.className = "icon-btn";
        del.setAttribute("aria-label", "Söhbəti sil");
        del.innerHTML = ICON_X;

        del.onclick = e => {
            e.stopPropagation();
            conversations = conversations.filter(x => x.id !== c.id);
            if (currentId === c.id) currentId = null;
            save();
            render();
        };

        row.append(name, del);
        historyBox.appendChild(row);
    });
}

/* ---------- Chat ---------- */
function renderWelcome() {
    const w = document.createElement("div");
    w.className = "welcome";

    const h = document.createElement("h1");
    h.textContent = "Salam, nə ilə kömək edim?";

    const p = document.createElement("p");
    p.textContent = "NEURA hazırdır.";

    const chips = document.createElement("div");
    chips.className = "chips";

    SUGGESTIONS.forEach(s => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = s;
        b.onclick = () => {
            input.value = s + ": ";
            autosize();
            updateSend();
            input.focus();
        };
        chips.appendChild(b);
    });

    w.append(h, p, chips);
    thread.appendChild(w);
}

function renderMessage(m) {
    const wrap = document.createElement("div");

    if (m.role === "user") {
        wrap.className = "msg user";
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = m.text;
        wrap.appendChild(b);
        return wrap;
    }

    wrap.className = "msg ai" + (m.error ? " error" : "");

    const body = document.createElement("div");
    body.className = "body";

    const prose = document.createElement("div");
    prose.className = "prose";
    setProse(prose, m.text);
    enhanceCode(prose);
    body.appendChild(prose);

    if (!m.error) {
        const actions = document.createElement("div");
        actions.className = "actions";

        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "text-btn";
        copy.innerHTML = ICON_COPY + "Kopyala";
        copy.onclick = async () => {
            await copyText(m.text);
            flash(copy, "Kopyalandı");
        };

        actions.appendChild(copy);
        body.appendChild(actions);
    }

    wrap.appendChild(body);
    return wrap;
}

function renderThinking() {
    const wrap = document.createElement("div");
    wrap.className = "msg ai";

    const body = document.createElement("div");
    body.className = "body";

    const row = document.createElement("div");
    row.className = "thinking";

    const dots = document.createElement("span");
    dots.className = "dots";
    dots.innerHTML = "<i></i><i></i><i></i>";

    const text = document.createElement("span");
    text.id = "thinkingText";
    text.textContent = slow ? "Server oyanır, bir az gözlə…" : "";

    row.append(dots, text);
    body.appendChild(row);
    wrap.appendChild(body);
    return wrap;
}

function renderChat() {
    thread.innerHTML = "";

    const current = getCurrent();

    if (!current || current.messages.length === 0) {
        renderWelcome();
        return;
    }

    current.messages.forEach(m => thread.appendChild(renderMessage(m)));

    if (pending && currentId ===
