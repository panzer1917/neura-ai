<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURA AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0d;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 22px;
    border-bottom: 1px solid #252529;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
}

header span {
    color: #999;
    font-size: 12px;
    display: block;
    margin-top: 5px;
    font-weight: normal;
    letter-spacing: 1px;
}

main {
    flex: 1;
    overflow-y: auto;
    padding: 25px 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.welcome {
    margin: auto;
    text-align: center;
}

.welcome h1 {
    font-size: 36px;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

.welcome p {
    color: #888;
    font-size: 14px;
}

.message {
    padding: 14px 17px;
    border-radius: 16px;
    max-width: 85%;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
}

.user {
    background: #29292e;
    align-self: flex-end;
}

.ai {
    background: #17171b;
    align-self: flex-start;
}

form {
    padding: 15px;
    border-top: 1px solid #252529;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    background: #19191d;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 15px;
    color: white;
    outline: none;
    font-size: 15px;
    min-width: 0;
}

button {
    background: white;
    color: black;
    border: none;
    border-radius: 13px;
    padding: 0 19px;
    font-size: 20px;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #666;
    font-size: 11px;
    padding: 0 10px 12px;
}
</style>
</head>

<body>

<header>
NEURA
<span>ARTIFICIAL INTELLIGENCE</span>
</header>

<main id="chat">
    <div class="welcome" id="welcome">
        <h1>NEURA</h1>
        <p>What can I help you with?</p>
    </div>
</main>

<form id="form">
    <input
        id="input"
        type="text"
        placeholder="Message NEURA..."
        autocomplete="off"
        required
    >
    <button type="submit">↑</button>
</form>

<footer>
NEURA AI · Version 1.0
</footer>

<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    document.getElementById("welcome")?.remove();

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;
    chat.appendChild(userMessage);

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent =
        "Salam! Mən NEURA AI-yam. Süni intellekt mühərrikim hələ qoşulmayıb. Tezliklə sizinlə söhbət edə biləcəyəm.";

    chat.appendChild(aiMessage);

    input.value = "";
    chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
