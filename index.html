<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURA AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b0d;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    height: 100dvh;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: 270px;
    background: #111114;
    border-right: 1px solid #29292e;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 10px 0 25px;
}

.new-chat {
    background: #252529;
    color: white;
    border: 1px solid #39393f;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
}

.history-title {
    color: #777;
    font-size: 12px;
    margin: 25px 0 12px;
}

.history {
    overflow-y: auto;
    flex: 1;
}

.chat-item {
    padding: 12px;
    border-radius: 9px;
    color: #ccc;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 5px;
}

.chat-item.active,
.chat-item:hover {
    background: #252529;
}

.chat-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.delete {
    color: #888;
    border: none;
    background: none;
    cursor: pointer;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

header {
    height: 75px;
    padding: 20px;
    border-bottom: 1px solid #252529;
    display: flex;
    align-items: center;
    gap: 15px;
    font-weight: bold;
    letter-spacing: 2px;
}

.menu {
    background: none;
    border: none;
    color: white;
    font-size: 23px;
    cursor: pointer;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.welcome {
    margin: auto;
    text-align: center;
}

.welcome h1 {
    font-size: 42px;
    letter-spacing: 5px;
    margin-bottom: 12px;
}

.welcome p {
    color: #888;
}

.message {
    padding: 14px 17px;
    border-radius: 15px;
    max-width: 85%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #29292e;
    align-self: flex-end;
}

.ai {
    background: #17171b;
    align-self: flex-start;
    white-space: normal;
}

.ai p {
    margin-bottom: 10px;
}

.ai p:last-child {
    margin-bottom: 0;
}

.ai ul,
.ai ol {
    padding-left: 22px;
    margin-bottom: 10px;
}

.ai pre {
    background: #0b0b0d;
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
    margin-bottom: 10px;
}

.ai code {
    background: #0b0b0d;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 14px;
}

.ai pre code {
    padding: 0;
    background: none;
}

form {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #252529;
}

input {
    flex: 1;
    min-width: 0;
    background: #19191d;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 16px;
    color: white;
    outline: none;
    font-size: 15px;
}

.send {
    background: white;
    color: black;
    border: none;
    border-radius: 14px;
    padding: 0 22px;
    font-size: 22px;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #666;
    font-size: 11px;
    padding: 0 10px 12px;
}

@media(max-width:650px) {
    .sidebar {
        position: fixed;
        z-index: 5;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform .2s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .chat {
        padding: 18px;
    }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">
    <div class="logo">NEURA</div>

    <button class="new-chat" onclick="newChat()">
        + New chat
    </button>

    <div class="history-title">YOUR CONVERSATIONS</div>

    <div class="history" id="history"></div>
</aside>

<section class="main">

<header>
    <button class="menu" onclick="toggleMenu()">☰</button>
    NEURA
</header>

<main class="chat" id="chat"></main>

<form id="form">
    <input
        id="input"
        placeholder="Message NEURA..."
        autocomplete="off"
        required
    >
    <button class="send" type="submit">↑</button>
</form>

<footer>NEURA AI · Version 1.1</footer>

</section>

<script>
const STORAGE = "neura_conversations";

let conversations = JSON.parse(
    localStorage.getItem(STORAGE) || "[]"
);

let currentId = null;

const chat = document.getElementById("chat");
const historyBox = document.getElementById("history");
const input = document.getElementById("input");

function save() {
    localStorage.setItem(
        STORAGE,
        JSON.stringify(conversations)
    );
}

function newChat() {
    currentId = Date.now();

    conversations.unshift({
        id: currentId,
        title: "New conversation",
        messages: []
    });

    save();
    render();
    input.focus();

    document.getElementById("sidebar")
        .classList.remove("open");
}

function getCurrent() {
    return conversations.find(c => c.id === currentId);
}

function renderHistory() {
    historyBox.innerHTML = "";

    conversations.forEach(c => {
        const row = document.createElement("div");
        row.className = "chat-item" +
            (c.id === currentId ? " active" : "");

        const name = document.createElement("span");
        name.className = "chat-name";
        name.textContent = c.title;

        name.onclick = () => {
            currentId = c.id;
            render();
            document.getElementById("sidebar")
                .classList.remove("open");
        };

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";

        del.onclick = e => {
            e.stopPropagation();

            conversations = conversations.filter(
                x => x.id !== c.id
            );

            if (currentId === c.id) {
                currentId = null;
            }

            save();
            render();
        };

        row.append(name, del);
        historyBox.appendChild(row);
    });
}

function renderChat() {
    chat.innerHTML = "";

    const current = getCurrent();

    if (!current || current.messages.length === 0) {
        const welcome = document.createElement("div");
        welcome.className = "welcome";

        const title = document.createElement("h1");
        title.textContent = "NEURA";

        const desc = document.createElement("p");
        desc.textContent = "What can I help you with?";

        welcome.append(title, desc);
        chat.appendChild(welcome);
        return;
    }

    current.messages.forEach(m => {
        const bubble = document.createElement("div");
        bubble.className = "message " + m.role;

        if (m.role === "ai") {
            bubble.innerHTML = DOMPurify.sanitize(marked.parse(m.text));
        } else {
            bubble.textContent = m.text;
        }

        chat.appendChild(bubble);
    });

    chat.scrollTop = chat.scrollHeight;
}

function render() {
    renderHistory();
    renderChat();
}

document.getElementById("form")
.addEventListener("submit", async e => {
    e.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    if (!currentId) {
        currentId = Date.now();
        conversations.unshift({
            id: currentId,
            title: text.slice(0, 30),
            messages: []
        });
    }

    const current = getCurrent();

    if (current.messages.length === 0) {
        current.title = text.slice(0, 30);
    }

    current.messages.push({
        role: "user",
        text: text
    });

    input.value = "";
    input.disabled = true;

    save();
    render();

    try {
        const response = await fetch(
            "https://neura-ai-mdy3.onrender.com/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: text })
            }
        );

        const data = await response.json();

        current.messages.push({
            role: "ai",
            text: data.reply || data.error || "Xəta baş verdi."
        });

    } catch (error) {
        current.messages.push({
            role: "ai",
            text: "Serverlə əlaqə qurmaq mümkün olmadı."
        });
    }

    input.disabled = false;
    save();
    render();
    input.focus();
});


function toggleMenu() {
    document.getElementById("sidebar")
        .classList.toggle("open");
}

render();
</script>

</body>
</html>
